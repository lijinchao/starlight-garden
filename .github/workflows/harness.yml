# Drift gate for starlight-garden.
# The base and the tool are released at tag v<version> and fetched by ./harness;
# no checkout of the coding-harness repository is needed.
name: harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fail on harness drift
        run: ./harness check --manifest harness.manifest.json
