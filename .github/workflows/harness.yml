# Harness gate for starlight-garden.
# The base and tool are released at tag v<version> and fetched by ./harness;
# one gate list (harness.manifest.json) drives local runs and CI.
name: harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Godot 4.6
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.6-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v4.6-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install Godot runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - name: Run every declared gate
        run: ./harness gates --manifest harness.manifest.json --report .harness/gates.jsonl
      - name: Report the first-pass rate
        if: always()
        run: ./harness metrics --log .harness/gates.jsonl
      - name: Prove every gate still fires
        run: ./harness prove --manifest harness.manifest.json --isolated --timeout 300
      - name: Archive the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: .harness/gates.jsonl
