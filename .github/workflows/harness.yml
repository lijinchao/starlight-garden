# Drift gate for starlight-garden.
# The base is a versioned release fetched from git at tag v<version> (M2); the tool is
# checked out at the same tag and its version is pinned in harness.manifest.json.
name: harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          path: starlight-garden
      - name: Read the pinned base version
        working-directory: starlight-garden
        run: echo "BASE_VERSION=$(node --eval 'console.log(require("./harness.manifest.json").version)')" >> "$GITHUB_ENV"
      - name: Check out the coding-harness tool at the pinned version
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/coding-harness
          path: coding-harness
          ref: v${{ env.BASE_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Fail on harness drift
        working-directory: starlight-garden
        run: node ../coding-harness/bin/harness.mjs check --manifest harness.manifest.json
